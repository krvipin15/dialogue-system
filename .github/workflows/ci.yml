---
name: CI Pipeline

# Triggers
"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Concurrency guard
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global environment variables
env:
  PYTHON_VERSION: "3.12"
  PRE_COMMIT_HOME: ~/.cache/pre-commit

# Jobs
jobs:
  # JOB 1 · Pre-Commit & Code Formatting
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # 1. Checkout full repo history
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # 2. Install uv (fast dependency manager)
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "code-quality"

      # 3. Install Python via uv
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # 4. Install dependencies
      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # 5. Cache pre-commit environments (huge speed boost)
      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-

      # 6. Run pre-commit hooks
      - name: Run pre-commit hooks
        run: |
          uv run pre-commit run --all-files \
            --show-diff-on-failure --color=always
